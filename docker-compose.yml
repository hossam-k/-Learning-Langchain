
services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - langchain_tut_network
    volumes:
      - .:/langchain-tutorial
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:15.3-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - langchain_tut_network

networks:
  langchain_tut_network:
    external: true
